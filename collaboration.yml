name: FTP Deploy

on:
  push:
    branches:
      - main  # Change this if you deploy from a different branch

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: FTP Deploy to Afrihost
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./  # Change this if your website files are in a subfolder
          remote-dir: /suseco.co.za/wwwroot
          git-ftp-args: --insecure  # Optional: use if you encounter SSL issues
